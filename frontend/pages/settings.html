<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings | PharmaKalCare</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">💊</div>
            <div>
                <h2>PharmaKalCare</h2><span>Pharmacy management</span>
            </div>
        </div>
        <nav class="sidebar-nav"><a href="dashboard.html">📊 Dashboard</a><a href="inventory.html">💊 Inventory</a><a
                href="sales.html">💰 Sales</a><a data-roles="Admin,Manager" href="reports.html">📈 Reports</a><a
                data-roles="Admin" href="users.html">👥 Users</a><a class="active" href="settings.html">⚙️ Settings</a>
        </nav>
        <div class="sidebar-bottom"><button data-logout>Sign out</button></div>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Profile settings</h1>
                <p>Update your personal details and picture.</p>
            </div>
            <div class="profile">
                <div class="avatar" data-profile-picture></div>
                <div class="profile-info"><strong data-user-name></strong><small data-user-role></small></div>
            </div>
        </header>
        <section class="content-card">
            <h2>Profile details</h2>
            <form id="profileForm" class="auth-form"><label>Name<input name="name" required></label><label>Email<input
                        name="email" type="email" required></label><label>Current password (required to change
                    password)<input name="currentPassword" type="password"
                        autocomplete="current-password"></label><label>New password (leave blank to keep current)<input
                        name="newPassword" type="password" minlength="8" autocomplete="new-password"></label><button
                    class="primary-button">Save profile</button></form>
        </section>
        <section class="content-card">
            <h2>Profile picture</h2>
            <form id="pictureForm" class="auth-form"><label>Select image (JPEG, PNG, WEBP or GIF; up to 3 MB)<input
                        type="file" name="profilePicture" accept="image/jpeg,image/png,image/webp,image/gif"
                        required></label><button class="primary-button">Upload picture</button></form>
        </section>
        <p id="message" class="message"></p>
        <script src="../js/common.js"></script>
        <script src="../js/settings.js"></script>
    </main>
</body>

</html>
