<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sales | PharmaKalCare</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">💊</div>
            <div>
                <h2>PharmaKalCare</h2><span>Pharmacy management</span>
            </div>
        </div>
        <nav class="sidebar-nav"><a href="dashboard.html">📊 Dashboard</a><a href="inventory.html">💊 Inventory</a><a
                class="active" href="sales.html">💰 Sales</a><a data-roles="Admin,Manager" href="reports.html">📈
                Reports</a><a data-roles="Admin" href="users.html">👥 Users</a><a href="settings.html">⚙️ Settings</a>
        </nav>
        <div class="sidebar-bottom"><button data-logout>Sign out</button></div>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Sales</h1>
                <p>Record a sale and print a receipt.</p>
            </div>
            <div class="profile">
                <div class="avatar" data-profile-picture></div>
                <div class="profile-info"><strong data-user-name></strong><small data-user-role></small></div>
            </div>
        </header>
        <section class="content-card">
            <h2>Sell medicine</h2>
            <form id="salesForm" class="medicine-form-grid"><label class="form-group">Medicine<select
                        id="medicineSelect" required></select></label><label class="form-group">Quantity<input
                        id="quantitySold" type="number" min="1" step="1" required></label><button
                    class="primary-button">Complete sale</button></form>
        </section>
        <section class="content-card">
            <h2>Recent sales</h2>
            <div class="table-wrapper">
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>Medicine</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Sold by</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="salesTable"></tbody>
                </table>
            </div>
        </section>
        <section class="content-card">
            <h2>Receipt</h2>
            <div id="receiptContent">No receipt generated yet.</div><button id="printReceiptBtn"
                class="secondary-button">Print receipt</button>
        </section>
        <p id="message" class="message"></p>
        <script src="../js/common.js"></script>
        <script src="../js/sales.js"></script>
    </main>
</body>

</html>
